monorepo_root = true

[env]
FIG_IDENTITY = "${FIG_IDENTITY:-namjul}"

[monorepo]
config_roots = [
  "aspects/*",
]

[settings]
sops.rops = false
experimental = true
env_shell_expand = true

[tools]
sops = "3.13.0"
age = "1.3.1"
deno = "2.8.0"
gomplate = "5.0.0"
fnox = "1.21.0"

[tasks."fig:test"]
description = "Run fig tests"
run = "deno test -A"

[tasks."fig:lint"]
description = "Lint fig modules"
run = "deno lint fig/"

[tasks."fig:check"]
description = "Type-check fig modules"
run = "deno check fig"

[tasks."fig:format"]
description = "Type-check fig modules"
run = "deno fmt fig"

[tasks."fig:verify"]
description = "Run fig check, lint, and tests"
depends = ["fig:check", "fig:lint", "fig:test"]

[tasks."fig"]
description = "Run all fig:* tasks"
depends = ["fig:*"]

[tasks."aspects:setup"]
description = "Verify the age key file sops reads for field extracts (not wage; not required for install.sh)"
run = """
#!/usr/bin/env bash
set -euo pipefail
AGE_KEY="${AGE_KEY_FILE:-$HOME/.config/age/key.txt}"
if [[ ! -f "$AGE_KEY" ]]; then
  echo "missing: $AGE_KEY — place your age identity file there"
  exit 1
fi
recipient="$(age-keygen -y "$AGE_KEY")"
echo "age key found: $AGE_KEY ($recipient)"
"""

[tasks."aspects:check"]
description = "Type-check fig modules"
run = "deno check aspects/**/*.ts"
