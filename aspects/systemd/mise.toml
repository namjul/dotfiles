[tasks.enable-services]
description = "Link and enable systemd user units"
usage = '''
flag "--now" help="Enable and immediately start user services"
'''
run = "./index.ts"

[tasks.bluetooth]
description = "Enable bluetooth.service on Arch (radio state is rfkill, not AutoEnable)"
run = "./bluetooth.ts"

[tasks.power]
description = "Enable power-profiles-daemon and AC/battery udev rule (Arch, battery only)"
run = "./power.ts"

[tasks.default]
description = "User units plus Arch bluetooth and power"
depends = [":enable-services"]
run = [
  { task = "bluetooth" },
  { task = "power" },
]
