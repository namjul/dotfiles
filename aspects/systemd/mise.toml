[tasks.enable-services]
description = "Link and enable systemd user units"
interactive = true
usage = '''
flag "--now" help="Enable and immediately start user services"
'''
run = "./index.ts"

[tasks.bluetooth]
description = "Enable bluetooth.service on Arch (radio state is rfkill, not AutoEnable)"
interactive = true
run = "./bluetooth.ts"

[tasks.power]
description = "Enable power-profiles-daemon and AC/battery udev rule (Arch, battery only)"
interactive = true
run = "./power.ts"

[tasks.docker]
description = "Enable docker.socket on Arch (package in aspects/aur)"
interactive = true
run = "./docker.ts"

[tasks.limits]
description = "Give Arch services and user sessions enough file descriptors for editors, watchers, and containers"
interactive = true
run = "./limits.ts"

[tasks.default]
description = "User units plus Arch bluetooth, power, docker, and nofile limits"
depends = [":enable-services"]
run = [
  { task = "bluetooth" },
  { task = "power" },
  { task = "docker" },
  { task = "limits" },
]
