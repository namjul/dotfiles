
[tasks."dir"]
description = "Ensure ~/.ssh directory exists (0700)"
run = "deno run --allow-all index.ts dir"

[tasks."config"]
description = "Install ~/.ssh/config from encrypted aspect file"
run = "deno run --allow-all index.ts config"

[tasks."keys"]
description = "Install SSH keys from key.yml via sops extract"
depends = [":dir"]
run = "deno run --allow-all index.ts keys"

[tasks."github-origin"]
description = "Point ~/.dotfiles origin at git@github.com if it is still HTTPS"
depends = [":keys"]
run = "deno run --allow-all index.ts github-origin"

[tasks.default]
description = "Manages local SSH config"
depends = [":dir", ":config", ":keys", ":github-origin"]
