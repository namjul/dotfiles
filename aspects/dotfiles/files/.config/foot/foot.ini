[main]
font=JetBrainsMonoNerdFont:style=Medium:size=9
include=~/.config/foot/themes/gruvbox-dark.ini
include=~/.config/foot/themes/gruvbox-light.ini
# initial-color-theme from ~/.local/state/foot-theme.ini (theme-apply)
include=~/.local/state/foot-theme.ini
pad=5x5
# Keep window pixel size fixed when zooming; only change font/grid (like alacritty).
resize-keep-grid=no
resize-by-cells=no

[csd]
preferred=none

[key-bindings]
primary-paste=none
clipboard-paste=Control+Shift+v Shift+Insert
clipboard-copy=Control+Insert
font-increase=Control+plus Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+equal Control+0 Control+KP_0

[text-bindings]
\x1b[13;2u = Shift+Return
\x1b[17~ = Control+i
