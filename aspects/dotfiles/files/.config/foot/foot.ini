[main]
font=JetBrainsMonoNerdFont:style=Medium:size=9
include=~/.config/foot/themes/gruvbox-dark.ini
include=~/.config/foot/themes/gruvbox-light.ini
initial-color-theme=light
pad=5x5

[csd]
preferred=none

[key-bindings]
clipboard-paste=Control+v Shift+Insert
clipboard-copy=Control+Insert

[text-bindings]
\x1b[13;2u = Shift+Return
\x1b[17~ = Control+i
