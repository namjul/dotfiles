[env]
SANDBOX_BLOCKED_FOLDERS = "{{env.HOME}}/Dropbox/memex/area"
AGE_KEY_FILE = "{{env.HOME}}/.config/age/key.txt"
FNOX_AGE_KEY_FILE = "{{env.AGE_KEY_FILE}}"
SOPS_AGE_KEY_FILE = "{{env.AGE_KEY_FILE}}"
MISE_AGE_KEY_FILE = "{{env.AGE_KEY_FILE}}"
TINTED_TMUX_OPTION_ACTIVE = "1"
TINTED_TMUX_OPTION_STATUSBAR = "1"
TRY_PATH = "{{env.HOME}}/code/tries"

[hooks]
postinstall = '''
mkdir -p ~/.config/fish/completions
mise completion fish > ~/.config/fish/completions/mise.fish
'''

