[[mgr.prepend_keymap]]
on = "y"
run = [
  'shell -- for path in %s; do echo "file://$path"; done | wl-copy --type text/uri-list',
  "yank",
]
desc = "Yank and copy selected files"
[[mgr.prepend_keymap]]
on = [ "g", "?" ]
run = "help"
desc = "Open help"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
