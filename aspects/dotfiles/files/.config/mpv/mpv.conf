# Persist playback position on quit; resume-playback is on by default.
save-position-on-quit
# Same file opened via file manager vs terminal often differs by path; store path in config.
write-filename-in-watch-later-config

# mimeapps / mpv.desktop use pseudo-gui (builtin profile sets idle=yes). Closing the
# window then leaves a background mpv without saving watch_later; next open is a new process.
[pseudo-gui]
idle=no
