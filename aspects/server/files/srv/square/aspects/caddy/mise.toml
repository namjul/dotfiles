[tools]
caddy = "2.11"

[env]
XDG_CONFIG_HOME = "{{config_root}}"
XDG_DATA_HOME = "{{env.SQUARE_PATH}}/data/share"

[tasks.default]
file = './default'

[tasks."caddy:config"]
description = 'Print caddy config'
run = """
#!/usr/bin/env bash
set -euxo pipefail
ssh $SERVER 'curl http://localhost:2019/config/'
"""
