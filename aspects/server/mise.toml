[env]
SERVER="homelab"
SQUARE_PATH="/home/square"

[tasks."init"]
description = 'Idempotent Initialization'
file = "init"

[tasks."up"]
description = 'Idempotent Upload'
file = "up"

[tasks."sync:all"]
description = 'Rsync server tree and aspects (init + up)'
depends = [":init", ":up"]

[tasks.default]
depends = [":sync:all"]

[tasks."local:prepare"]
description = 'Local SSH keys and client config for SERVER'
tools.sops = "latest"
run = """
#!/usr/bin/env bash
set -euo pipefail
sops -d --extract '["public_key"]' --output ~/.ssh/id_ed25519_personal-server.pub secrets/ssh.yml
sops -d --extract '["private_key"]' --output ~/.ssh/id_ed25519_personal-server secrets/ssh.yml
chmod 600 ~/.ssh/id_ed25519_personal-server ~/.ssh/id_ed25519_personal-server.pub
grep -q hobl.at ~/.ssh/config > /dev/null 2>&1 || cat config/ssh_client_config >> ~/.ssh/config
"""

[tasks.packages]
description = 'Base packages on SERVER'
run = """
#!/usr/bin/env bash
set -euo pipefail
packages="curl vim htop ufw git unzip gnupg acl mosh ncdu ca-certificates rsync"
ssh root@$SERVER "set -euo pipefail
  export DEBIAN_FRONTEND=noninteractive
  apt-get update -y
  apt-get full-upgrade -y
  apt-get install -y $packages
  apt-get autoremove -y
  echo 'unattended-upgrades unattended-upgrades/enable_auto_updates boolean true' | debconf-set-selections
  apt-get install -y unattended-upgrades
  if [ -f /var/run/reboot-required ]; then
    echo 'NOTE: Reboot required after upgrades. Run: mise run reboot-if-required'
    cat /var/run/reboot-required 2>/dev/null || true
  fi
"
"""

[tasks."reboot-if-required"]
description = 'Reboot SERVER only if /var/run/reboot-required exists'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "bash -lc '
  if [ ! -f /var/run/reboot-required ]; then
    echo \"No reboot required\"
    exit 0
  fi
  cat /var/run/reboot-required 2>/dev/null || true
  echo \"Rebooting...\"
  nohup systemctl reboot >/dev/null 2>&1 &
  sleep 1
'"
"""

[tasks."ssh:config"]
description = 'Deploy sshd_config if changed and restart ssh'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cat /etc/ssh/sshd_config" | diff - "$MISE_TASK_DIR/config/sshd_config" || (
  scp "$MISE_TASK_DIR/config/sshd_config" "root@$SERVER:/etc/ssh/sshd_config"
  ssh root@$SERVER systemctl restart ssh.service
)
"""

[tasks."root-lock"]
description = 'Lock root console password (idempotent; run after key-based SSH works)'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER 'passwd -l root'
"""

[tasks.firewall]
description = 'Setup firewall'
run = """
#!/usr/bin/env bash
set -euo pipefail
scp "$MISE_TASK_DIR/config/ufw.sh" "root@$SERVER:/tmp/ufw.sh"
ssh root@$SERVER 'chmod +x /tmp/ufw.sh && /tmp/ufw.sh'
"""

[tasks.harden]
description = 'SSH hardening: sshd_config, lock root console, firewall'
depends = [":ssh:config", ":root-lock", ":firewall"]

[tasks.base]
description = 'Packages, sync server tree, harden (requires ssh root@$SERVER with keys)'
depends = [":packages", ":sync:all", ":harden"]

[tasks.provision]
description = 'Full provision from laptop: local keys, base server setup'
depends = [":local:prepare", ":base"]

[tasks.aspect]
description = 'Run a mise task in an aspect on SERVER'
usage = 'arg "<aspect>" help="Aspect under $SQUARE_PATH/aspects" arg "[cmd]" help="Mise task; defaults to aspect name"'
run = """
#!/usr/bin/env bash
set -euo pipefail
aspect="${usage_aspect?}"
cmd="${usage_cmd:-$aspect}"
ssh root@$SERVER "cd $SQUARE_PATH/aspects/$aspect && mise trust && mise install && mise run $cmd"
"""

[tasks."aspect:default"]
description = 'Run default task for an aspect on SERVER'
usage = 'arg "<aspect>" help="Aspect under $SQUARE_PATH/aspects"'
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run aspect -- "${usage_aspect?}" default
"""

[tasks."aspect:log"]
description = 'Log aspect'
usage = 'arg "<aspect>" help="Systemd service name to follow"'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "journalctl -u ${usage_aspect?}.service -f"
"""
