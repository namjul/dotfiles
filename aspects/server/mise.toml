[env]
SERVER="homelab"

[vars]
# Root XDG base dirs (also written to /etc/environment; aspects use these paths)
XDG_CONFIG_HOME = "/root/.config"
XDG_DATA_HOME = "/root/.local/share"
XDG_STATE_HOME = "/root/.local/state"
XDG_CACHE_HOME = "/root/.cache"
# Anki sync — templated into {{ vars.XDG_CONFIG_HOME }}/anki/compose.env
SYNC_USER1 = "user:pass"
ANKI_VERSION = "24.06.3"

[tools]
caddy = "2.11"
ghq = "latest"
python = "3.11"
node = "22"
"npm:zx" = "latest"

[bootstrap.remote]
source = "."
install_mise = true

[bootstrap.remote.hosts.homelab]
host = "homelab"
user = "root"

[bootstrap.groups.homelab]

# Unpinned install (do not use "present" — apt treats it as a version pin: curl=present)
[bootstrap.packages]
"apt:curl" = "latest"
"apt:vim" = "latest"
"apt:htop" = "latest"
"apt:ufw" = "latest"
"apt:git" = "latest"
"apt:unzip" = "latest"
"apt:gnupg" = "latest"
"apt:acl" = "latest"
"apt:mosh" = "latest"
"apt:ncdu" = "latest"
"apt:ca-certificates" = "latest"
"apt:rsync" = "latest"
"apt:ripgrep" = "latest"
"apt:jq" = "latest"
"apt:unattended-upgrades" = "latest"
"apt:docker.io" = "latest"
"apt:docker-compose" = "latest"

[bootstrap.hooks.post-packages]
run = '''
#!/bin/sh
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update -y
apt-get full-upgrade -y
apt-get autoremove -y
echo 'unattended-upgrades unattended-upgrades/enable_auto_updates boolean true' | debconf-set-selections
if [ -f /var/run/reboot-required ]; then
  echo 'NOTE: Reboot required after upgrades. Run: mise run reboot-if-required'
  cat /var/run/reboot-required 2>/dev/null || true
fi
usermod -aG homelab root 2>/dev/null || true
'''

[bootstrap.files."/etc/ssh/sshd_config"]
source = "bootstrap/sshd_config"

[bootstrap.files."/etc/environment"]
source = "host/etc/environment"
template = true

[bootstrap.files."/etc/gitconfig"]
source = "host/etc/gitconfig"

[bootstrap.files."/root/.bashrc"]
source = "bootstrap/root/.bashrc"
template = true

[bootstrap.files."/root/.vimrc"]
source = "bootstrap/root/.vimrc"

[bootstrap.files."/etc/systemd/system/caddy.service"]
source = "aspects/caddy/caddy.service"

[bootstrap.files."/etc/caddy/Caddyfile"]
source = "aspects/caddy/Caddyfile"

[bootstrap.files."/etc/caddy/conf.d/anki.caddy"]
source = "aspects/anki/caddyfile"

[bootstrap.files."/root/.config/anki/compose/compose.yaml"]
source = "aspects/anki/compose.yaml"

[bootstrap.files."/root/.config/anki/compose/Dockerfile"]
source = "aspects/anki/Dockerfile"

[bootstrap.files."/root/.config/anki/compose/mise.toml"]
source = "aspects/anki/mise.toml"

[bootstrap.directories."/etc/caddy/conf.d"]
mode = "0755"

[bootstrap.directories."/root/.config/anki/compose"]
mode = "0755"

[bootstrap.directories."/root/.local/share/anki/sync"]
group = "homelab"
mode = "2770"

[bootstrap.files."/root/.config/anki/compose.env"]
template = true
group = "homelab"
mode = "0640"
content = """
XDG_CONFIG_HOME={{ vars.XDG_CONFIG_HOME }}
XDG_DATA_HOME={{ vars.XDG_DATA_HOME }}
SYNC_USER1={{ vars.SYNC_USER1 }}
HOMELAB_GID={{ exec(command='getent group homelab | cut -d: -f3') }}
ANKI_VERSION={{ vars.ANKI_VERSION }}
"""

[bootstrap.compose.anki]
project_dir = "/root/.config/anki/compose"
files = ["compose.yaml"]
env_files = ["/root/.config/anki/compose.env"]
project_name = "anki"
state = "running"
build = "always"
remove_orphans = true
depends_on = ["service:docker"]

[bootstrap.hooks.post-tools]
run = '''
#!/bin/sh
set -eu
if ! command -v tailscale >/dev/null 2>&1; then
  curl -fsSL https://tailscale.com/install.sh | sh
fi
if systemctl is-active --quiet caddy.service; then
  if ! systemctl reload caddy.service; then
    echo 'NOTE: caddy reload failed; trying restart (see journalctl -u caddy.service if this fails)' >&2
    systemctl restart caddy.service || echo 'NOTE: caddy restart failed; fix config and run: systemctl restart caddy' >&2
  fi
fi
'''

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.caddy]
state = "running"
enabled = true

[bootstrap.services.tailscaled]
state = "running"
enabled = true

[bootstrap.hooks.final]
run = '''
#!/bin/sh
set -eu
systemctl restart ssh.service
passwd -l root
'''

[bootstrap.linux.firewall]
backend = "auto"
state = "enabled"
default_incoming = "deny"
default_outgoing = "allow"
allow_lockout = true

[[bootstrap.linux.firewall.rules]]
name = "ssh"
port = 22
protocol = "tcp"
action = "allow"

[[bootstrap.linux.firewall.rules]]
name = "http"
port = 80
protocol = "tcp"
action = "allow"

[[bootstrap.linux.firewall.rules]]
name = "https"
port = 443
protocol = "tcp"
action = "allow"

[[bootstrap.linux.firewall.rules]]
name = "k8s-api"
port = 6443
protocol = "tcp"
action = "allow"

[[bootstrap.linux.firewall.rules]]
name = "mosh-udp"
port = "60000:61000"
protocol = "udp"
action = "allow"

[[bootstrap.linux.firewall.rules]]
name = "misc-23231"
port = 23231
protocol = "tcp"
action = "allow"

[tasks.default]
depends = [":converge"]

[tasks."local:prepare"]
description = 'Local SSH keys and client config for SERVER'
tools.sops = "latest"
run = """
#!/usr/bin/env bash
set -euo pipefail
sops -d --extract '["public_key"]' --output ~/.ssh/id_ed25519_personal-server.pub secrets/ssh.yml
sops -d --extract '["private_key"]' --output ~/.ssh/id_ed25519_personal-server secrets/ssh.yml
chmod 600 ~/.ssh/id_ed25519_personal-server ~/.ssh/id_ed25519_personal-server.pub
grep -q hobl.at ~/.ssh/config > /dev/null 2>&1 || cat config/ssh_client_config >> ~/.ssh/config
"""

[tasks."anki:retire-square-compose"]
description = 'One-time: stop Anki compose from /srv/square so bootstrap can adopt project_name anki at new paths'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER 'set -euo pipefail
old=/srv/square/aspects/anki
if [ -f "$old/compose.yaml" ]; then
  env_file=/srv/square/data/private/anki-compose.env
  [ -f "$env_file" ] || env_file="$old/.env"
  if [ -f "$env_file" ]; then
    docker compose -f "$old/compose.yaml" --env-file "$env_file" --project-name anki down --remove-orphans 2>/dev/null || true
  else
    docker compose -f "$old/compose.yaml" --project-name anki down --remove-orphans 2>/dev/null || true
  fi
fi
docker compose -p anki down --remove-orphans 2>/dev/null || true
docker rm -f anki-sync-server 2>/dev/null || true
echo "Old anki compose stopped; run mise run converge"'
"""

[tasks.converge]
description = 'Full bootstrap remote homelab (packages, sshd, firewall, apps, final-hook)'
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "${MISE_CONFIG_ROOT}"
mise bootstrap remote homelab --yes --update -q
"""

[tasks."reboot-if-required"]
description = 'Reboot SERVER only if /var/run/reboot-required exists'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER 'set -euo pipefail
if [ ! -f /var/run/reboot-required ]; then
  echo "No reboot required"
  exit 0
fi
cat /var/run/reboot-required 2>/dev/null || true
echo "Rebooting..."
nohup systemctl reboot >/dev/null 2>&1 &
sleep 1'
"""

[tasks."aspect:log"]
description = 'Log aspect'
usage = 'arg "<aspect>" help="Systemd service name to follow"'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "journalctl -u ${usage_aspect?}.service -f"
"""

[tasks."tailscale:join"]
description = 'Join SERVER to tailnet (laptop-only; prompt for auth key; stdin to Pi)'
interactive = true
run = """
#!/usr/bin/env bash
# Auth key on SSH stdin → tailscale up (key never in ssh argv).
set -euo pipefail

JOIN_HOSTNAME="${TAILSCALE_JOIN_HOSTNAME:-homelab}"

state="$(ssh root@$SERVER 'tailscale status --json 2>/dev/null | jq -r ".BackendState // empty" 2>/dev/null' || true)"
if [[ "${state}" == "Running" ]]; then
  echo "Already joined."
  exit 0
fi

if ! ssh root@$SERVER 'command -v tailscale >/dev/null 2>&1 && systemctl is-active --quiet tailscaled'; then
  echo "Tailscale not ready on SERVER. Run: mise run converge" >&2
  exit 1
fi

echo -n "Tailscale auth key (one-time; input hidden): " >&2
IFS= read -rs TS_AUTH_KEY
echo >&2

if [[ -z "${TS_AUTH_KEY}" ]]; then
  echo "Empty auth key." >&2
  exit 1
fi

printf '%s' "${TS_AUTH_KEY}" | ssh root@$SERVER env HOST="${JOIN_HOSTNAME}" bash -c 'read -r TS_AUTH_KEY; tailscale up --auth-key="$TS_AUTH_KEY" --hostname="$HOST"'

unset TS_AUTH_KEY
"""

[tasks."tailscale:status"]
description = 'Tailscale status and tailnet IPv4 on SERVER'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER 'set -euo pipefail; tailscale status; tailscale ip -4'
"""

[tasks."caddy:config"]
description = 'Print Caddy admin API config from SERVER'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER 'curl -s http://localhost:2019/config/'
"""

[tasks."caddy:root-ca"]
description = 'Copy Caddy internal root CA from SERVER; optional local trust (Arch p11-kit)'
usage = '''
flag "--trust" help="Install into this machine trust store (sudo trust anchor --store)"
arg "[dest]" help="Local path for root.crt (default: ~/.local/share/homelab/caddy-local-root.crt)"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

dest="${usage_dest:-$HOME/.local/share/homelab/caddy-local-root.crt}"

remote_root="$(ssh root@$SERVER 'echo "${XDG_DATA_HOME:-/root/.local/share}/caddy/pki/authorities/local/root.crt"')"

if ! ssh root@$SERVER "test -r \"${remote_root}\""; then
  echo "Missing on SERVER: ${remote_root}" >&2
  echo "Start Caddy with tls internal (mise run converge)." >&2
  exit 1
fi

mkdir -p "$(dirname "$dest")"
scp "root@${SERVER}:${remote_root}" "$dest"
echo "Wrote ${dest}"

if [[ -n "${usage_trust:-}" ]]; then
  if ! command -v trust >/dev/null 2>&1; then
    echo "No 'trust' command (p11-kit). Import ${dest} manually (Firefox: Authorities)." >&2
    exit 1
  fi
  sudo trust anchor --store "$dest"
  echo "Installed into local trust store (Chromium and most apps)."
  echo "Firefox still needs manual import if you use it."
fi
"""

[tasks.health]
description = 'Smoke health checks on SERVER (caddy, anki, docker, paths) and https://homelab/anki/ from laptop'
run = """
#!/usr/bin/env bash
set -uo pipefail

failures=0
pass() { echo "ok  $*"; }
fail() { echo "FAIL $*" >&2; failures=$((failures + 1)); }

echo "=== homelab health (SERVER=${SERVER}) ==="

ssh root@$SERVER 'set -uo pipefail
mise_bin=/root/.local/bin/mise
failures=0
pass() { echo "ok  $1"; }
fail() { echo "FAIL $1" >&2; failures=$((failures + 1)); }

if systemctl is-active --quiet caddy.service; then pass "caddy.service active"; else fail "caddy.service not active"; fi
if systemctl is-active --quiet docker.service; then pass "docker.service active"; else fail "docker.service not active"; fi

if [ -x "$mise_bin" ] && "$mise_bin" exec caddy -- caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1; then
  pass "caddy validate"
else
  fail "caddy validate (mise exec caddy or Caddyfile)"
fi

if docker ps --filter name=anki-sync-server -q 2>/dev/null | grep -q .; then
  pass "anki-sync-server container"
else
  fail "anki-sync-server container not running"
fi

anki_code="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 http://127.0.0.1:8080/ || true)"
if [ -n "$anki_code" ] && [ "$anki_code" != "000" ]; then
  pass "anki backend 127.0.0.1:8080 (HTTP $anki_code)"
else
  fail "anki backend 127.0.0.1:8080 (no TCP/HTTP response; docker logs anki-sync-server)"
fi

for path in /etc/caddy/Caddyfile /etc/caddy/conf.d/anki.caddy /root/.config/anki/compose.env /root/.config/anki/compose/compose.yaml /root/.local/share/anki/sync; do
  if [ -e "$path" ]; then pass "path $path"; else fail "missing $path"; fi
done

if getent group homelab >/dev/null 2>&1; then pass "group homelab"; else fail "group homelab"; fi

if grep -q "^XDG_DATA_HOME=" /etc/environment 2>/dev/null && ! grep -q "^SQUARE_PATH=" /etc/environment 2>/dev/null; then
  pass "/etc/environment XDG (no SQUARE_PATH)"
else
  fail "/etc/environment (expect XDG_* without SQUARE_PATH)"
fi

if grep -q "mise exec caddy -- caddy" /etc/systemd/system/caddy.service 2>/dev/null; then
  pass "caddy.unit mise exec caddy"
else
  fail "caddy.unit (expect mise exec caddy -- caddy)"
fi

exit "$failures"
' || failures=$((failures + 1))

echo "=== from laptop ==="
edge_code="$(curl -sk -o /dev/null -w '%{http_code}' --connect-timeout 5 https://homelab/anki/ || true)"
if [ -n "$edge_code" ] && [ "$edge_code" != "000" ] && [ "$edge_code" != "502" ] && [ "$edge_code" != "503" ]; then
  pass "https://homelab/anki/ (HTTP $edge_code)"
else
  fail "https://homelab/anki/ (HTTP ${edge_code:-000}; DNS, TLS, Caddy, or Anki backend)"
fi

if [ "$failures" -eq 0 ]; then
  echo "=== all checks passed ==="
  exit 0
fi
echo "=== $failures check(s) failed ===" >&2
exit 1
"""
