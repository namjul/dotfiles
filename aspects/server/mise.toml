[env]
SERVER="homelab"
SQUARE_PATH="/srv/square"

[tasks."init"]
description = 'Idempotent Initialization'
file = "init"

[tasks."up"]
description = 'Idempotent Upload'
file = "up"

[tasks."sync:all"]
description = 'Rsync server tree and aspects (init then up)'
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run init
mise run up
"""

[tasks.default]
depends = [":sync:all"]

[tasks."local:prepare"]
description = 'Local SSH keys and client config for SERVER'
tools.sops = "latest"
run = """
#!/usr/bin/env bash
set -euo pipefail
sops -d --extract '["public_key"]' --output ~/.ssh/id_ed25519_personal-server.pub secrets/ssh.yml
sops -d --extract '["private_key"]' --output ~/.ssh/id_ed25519_personal-server secrets/ssh.yml
chmod 600 ~/.ssh/id_ed25519_personal-server ~/.ssh/id_ed25519_personal-server.pub
grep -q hobl.at ~/.ssh/config > /dev/null 2>&1 || cat config/ssh_client_config >> ~/.ssh/config
"""

[tasks.packages]
description = 'Base packages on SERVER'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run packages"
"""

[tasks."reboot-if-required"]
description = 'Reboot SERVER only if /var/run/reboot-required exists'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run reboot-if-required"
"""

[tasks."ssh:config"]
description = 'Deploy sshd_config if changed and restart ssh'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run ssh-config"
"""

[tasks."root-lock"]
description = 'Lock root console password (idempotent; run after key-based SSH works)'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run root-lock"
"""

[tasks.firewall]
description = 'Setup firewall'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run firewall"
"""

[tasks.docker]
description = 'Install Docker Engine and compose plugin on SERVER'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run docker"
"""

[tasks.harden]
description = 'SSH hardening: sshd_config, lock root console, firewall'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run harden"
"""

[tasks.base]
description = 'Packages, sync server tree, harden (requires ssh root@$SERVER with keys)'
depends = [":packages", ":sync:all", ":harden"]

[tasks.provision]
description = 'Full provision from laptop: local keys, base server setup'
depends = [":local:prepare", ":base"]

[tasks.aspect]
description = 'Run a mise task in an aspect on SERVER'
usage = '''
arg "<aspect>" help="Aspect under $SQUARE_PATH/aspects"
arg "[cmd]" help="Mise task on SERVER; defaults to default"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail
aspect="${usage_aspect?}"
cmd="${usage_cmd:-default}"
ssh root@$SERVER "cd $SQUARE_PATH/aspects/$aspect && mise trust && mise install && mise run $cmd"
"""

[tasks."aspect:log"]
description = 'Log aspect'
usage = 'arg "<aspect>" help="Systemd service name to follow"'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "journalctl -u ${usage_aspect?}.service -f"
"""

[tasks."tailscale:join"]
description = 'Join SERVER to tailnet (laptop-only; prompt for auth key; stdin to Pi)'
interactive = true
run = """
#!/usr/bin/env bash
# Auth key on SSH stdin → tailscale up (key never in ssh argv).
set -euo pipefail

JOIN_HOSTNAME="${TAILSCALE_JOIN_HOSTNAME:-homelab}"

state="$(ssh root@$SERVER 'tailscale status --json 2>/dev/null | jq -r ".BackendState // empty" 2>/dev/null' || true)"
if [[ "${state}" == "Running" ]]; then
  echo "Already joined."
  exit 0
fi

(cd "${MISE_TASK_DIR}" && mise run aspect tailscale)

echo -n "Tailscale auth key (one-time; input hidden): " >&2
IFS= read -rs TS_AUTH_KEY
echo >&2

if [[ -z "${TS_AUTH_KEY}" ]]; then
  echo "Empty auth key." >&2
  exit 1
fi

printf '%s' "${TS_AUTH_KEY}" | ssh root@$SERVER env HOST="${JOIN_HOSTNAME}" bash -c 'read -r TS_AUTH_KEY; tailscale up --auth-key="$TS_AUTH_KEY" --hostname="$HOST"'

unset TS_AUTH_KEY
"""

[tasks."tailscale:status"]
description = 'Tailscale status and tailnet IPv4 on SERVER'
run = """
#!/usr/bin/env bash
set -euo pipefail
ssh root@$SERVER "cd $SQUARE_PATH && mise run tailscale-status"
"""

[tasks."caddy:root-ca"]
description = 'Copy Caddy internal root CA from SERVER; optional local trust (Arch p11-kit)'
usage = '''
flag "--trust" help="Install into this machine trust store (sudo trust anchor --store)"
arg "[dest]" help="Local path for root.crt (default: ~/.local/share/homelab/caddy-local-root.crt)"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

remote_root="${SQUARE_PATH}/data/share/caddy/pki/authorities/local/root.crt"
dest="${usage_dest:-$HOME/.local/share/homelab/caddy-local-root.crt}"

if ! ssh root@$SERVER "test -r '${remote_root}'"; then
  echo "Missing on SERVER: ${remote_root}" >&2
  echo "Start Caddy with tls internal and XDG_DATA_HOME=${SQUARE_PATH}/data/share (mise run aspect caddy)." >&2
  exit 1
fi

mkdir -p "$(dirname "$dest")"
scp "root@${SERVER}:${remote_root}" "$dest"
echo "Wrote ${dest}"

if [[ -n "${usage_trust:-}" ]]; then
  if ! command -v trust >/dev/null 2>&1; then
    echo "No 'trust' command (p11-kit). Import ${dest} manually (Firefox: Authorities)." >&2
    exit 1
  fi
  sudo trust anchor --store "$dest"
  echo "Installed into local trust store (Chromium and most apps)."
  echo "Firefox still needs manual import if you use it."
fi
"""
